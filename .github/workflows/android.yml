# Unit tests + the APK on every push / PR; screenshots of the screens from an emulator.
# Publishing a release (tag = versionName, e.g. 1.0.0) attaches ArtCoreMusicRemote-<version>.apk to it.
#
# Release signing (optional): repository secrets
#   ANDROID_KEYSTORE_BASE64  — the .jks / .keystore file in base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with the debug key in keystore/debug.keystore.
name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"; tag="${tag#v}"; tag="${tag#V}"
          code=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$code" ]; then echo "::error::Release tag $tag does not match appVersion $code"; exit 1; fi

      - name: Release key from the secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ARTCORE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signing with the release key"
          else
            echo "no ANDROID_KEYSTORE_BASE64 secret: signing with the debug key"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the APK
        env:
          ARTCORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ARTCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARTCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          ver=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ArtCoreMusicRemote-$ver.apk"
          ls -la out

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ArtCoreMusicRemote-${{ github.sha }}
          path: out/*.apk

      - name: Attach to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.apk --clobber --repo "${{ github.repository }}"

  screenshots:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Screenshots on an emulator (Pixel 7, Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.ruf790.artcore.remote.ScreenshotTest com.ruf790.artcore.remote.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "^OK (" instrument.txt
            mkdir -p screens
            adb exec-out run-as com.ruf790.artcore.remote tar cf - files/screens > screens/screens.tar
            tar xf screens/screens.tar -C screens && rm screens/screens.tar && ls -la screens/files/screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screens/files/screens/*.png
            instrument.txt
          if-no-files-found: warn
